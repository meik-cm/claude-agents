<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proposal Strategist</title>
<meta name="description" content="A Claude Code subagent that turns RFPs into win narratives.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --muted: #475569;
    --border: #e2e8f0; --accent: #2563eb; --accent-soft: #dbeafe; --code-bg: #f1f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1120; --surface: #111827; --text: #e5e7eb; --muted: #94a3b8;
      --border: #1f2937; --accent: #60a5fa; --accent-soft: #1e3a5f; --code-bg: #0f172a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.65 Inter, system-ui, -apple-system, sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 16px; }
  header { padding: 56px 0 32px; border-bottom: 1px solid var(--border); }
  .badge { display: inline-block; font-size: 13px; font-weight: 600; color: var(--accent);
    background: var(--accent-soft); padding: 4px 10px; border-radius: 999px; }
  h1.title { font-size: clamp(32px, 6vw, 44px); line-height: 1.15; margin: 16px 0 8px; }
  .vibe { font-size: 19px; color: var(--muted); margin: 0 0 24px; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn { font: inherit; font-size: 15px; font-weight: 600; padding: 10px 16px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    text-decoration: none; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  section.install { margin: 32px 0; padding: 20px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; }
  section.install h2 { margin: 0 0 8px; font-size: 18px; }
  section.install p { margin: 0 0 12px; color: var(--muted); }
  pre, code { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13.5px; }
  pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px; overflow-x: auto; margin: 0; }
  :not(pre) > code { background: var(--code-bg); padding: 2px 5px; border-radius: 4px; }
  article { padding-bottom: 64px; }
  article h1 { display: none; }
  article h2 { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 24px; }
  article h3 { margin-top: 28px; font-size: 18px; }
  article pre { margin: 12px 0; }
  .table-wrap { overflow-x: auto; }
  article table { border-collapse: collapse; width: 100%; font-size: 14px; }
  article th, article td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  article hr { border: 0; border-top: 1px solid var(--border); margin: 32px 0; }
  a { color: var(--accent); }
  .err { color: #dc2626; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">🏹 Claude Code subagent</span>
    <h1 class="title">Proposal Strategist</h1>
    <p class="vibe" id="vibe">Turns RFP responses into stories buyers can't put down.</p>
    <div class="actions">
      <a class="btn primary" id="download" href=".claude/agents/sales-proposal-strategist.md" download>Download agent file</a>
      <button class="btn" id="copy" type="button">Copy install command</button>
    </div>
  </header>

  <section class="install">
    <h2>Install</h2>
    <p>Save the agent into your user-level agents folder so it's available in every project:</p>
    <pre id="cmd"></pre>
  </section>

  <article id="content"><p>Loading…</p></article>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
  const FILE = ".claude/agents/sales-proposal-strategist.md";
  const fileUrl = new URL(FILE, location.href).href;
  const cmd = `mkdir -p ~/.claude/agents && curl -fsSL ${fileUrl} -o ~/.claude/agents/sales-proposal-strategist.md`;
  document.getElementById("cmd").textContent = cmd;
  document.getElementById("copy").addEventListener("click", async (e) => {
    try { await navigator.clipboard.writeText(cmd); e.target.textContent = "Copied!"; }
    catch { e.target.textContent = "Copy failed"; }
    setTimeout(() => (e.target.textContent = "Copy install command"), 1500);
  });

  fetch(FILE).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(md => {
    const fm = md.match(/^---\n([\s\S]*?)\n---\n/);
    if (fm) {
      const vibe = fm[1].match(/^vibe:\s*(.+)$/m);
      if (vibe) document.getElementById("vibe").textContent = vibe[1];
      md = md.slice(fm[0].length);
    }
    const el = document.getElementById("content");
    el.innerHTML = marked.parse(md);
    el.querySelectorAll("table").forEach(t => {
      const w = document.createElement("div"); w.className = "table-wrap";
      t.replaceWith(w); w.appendChild(t);
    });
  }).catch(err => {
    document.getElementById("content").innerHTML =
      `<p class="err">Couldn't load the agent file (${err.message}).</p>`;
  });
</script>
</body>
</html>
