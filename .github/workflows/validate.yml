name: Validate site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: HTML validation (html-validate)
        run: npx --yes html-validate@11 agentic-ai-pitch/index.html

      - name: Link check (internal anchors + external links)
        uses: lycheeverse/lychee-action@v2
        with:
          # Pinned so lychee.toml syntax (include_fragments = "full") stays compatible.
          lycheeVersion: v0.24.2
          args: --config lychee.toml --no-progress agentic-ai-pitch/index.html
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
